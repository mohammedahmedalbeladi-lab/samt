<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>سَمْت</title>
<script>try{var t=localStorage.getItem('samt_theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: white cards on a cool teal-grey field, navy + teal from the ministry palette, one task per screen. */
:root{
  --navy:#15445a; --teal:#0da9a6; --green:#07a869; --blue:#3d7eb9; --gold:#c1b489; --purple:#7258a4;
  --bg:#f2f6f7; --surface:#ffffff; --ink:#123241; --muted:#5b7380; --line:#dbe5e9; --soft:#f6f9fa;
  --accent:#0a8b88; --accent-ink:#ffffff; --accent-soft:#e2f4f3; --accent-line:#9fd9d6;
  --hero-a:#ffffff; --hero-b:#e6f4f3;
  --ok:#068a57; --ok-soft:#e1f5ec; --amb:#a8730f; --amb-soft:#fbf1dc; --bad:#b4403c; --bad-soft:#fbe5e4;
  --tR:#b08d3c; --tI:#3d7eb9; --tA:#7258a4; --tS:#07a869; --tE:#0da9a6; --tC:#5f7480;
  --f:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --r:16px; --sh:0 1px 2px rgba(21,68,90,.05),0 6px 20px rgba(21,68,90,.06);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a171d; --surface:#10232b; --ink:#e3eef1; --muted:#8ea8b2; --line:#1f3a45; --soft:#0d1d24;
  --accent:#2fc4bf; --accent-ink:#04201f; --accent-soft:#123634; --accent-line:#1e6a67;
  --hero-a:#10232b; --hero-b:#123634;
  --ok:#4fd197; --ok-soft:#123326; --amb:#e8b452; --amb-soft:#352a12; --bad:#f08a86; --bad-soft:#3a1c1c;
  --tR:#d2b064; --tI:#6fa6dd; --tA:#a58cd6; --tS:#38c98d; --tE:#38cfcb; --tC:#93a8b3;
  --sh:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0a171d; --surface:#10232b; --ink:#e3eef1; --muted:#8ea8b2; --line:#1f3a45; --soft:#0d1d24;
  --accent:#2fc4bf; --accent-ink:#04201f; --accent-soft:#123634; --accent-line:#1e6a67;
  --hero-a:#10232b; --hero-b:#123634;
  --ok:#4fd197; --ok-soft:#123326; --amb:#e8b452; --amb-soft:#352a12; --bad:#f08a86; --bad-soft:#3a1c1c;
  --tR:#d2b064; --tI:#6fa6dd; --tA:#a58cd6; --tS:#38c98d; --tE:#38cfcb; --tC:#93a8b3;
  --sh:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark;}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.75;-webkit-text-size-adjust:100%}
h1,h2,h3,h4{text-wrap:balance;line-height:1.45;margin:0;font-weight:700}
p{margin:0}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.ic{display:inline-block;flex:none;vertical-align:middle}
.sr{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* header */
.hdr{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.hdr-in{max-width:1100px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:20px;color:var(--navy);background:none;border:0;cursor:pointer;padding:0;white-space:nowrap}
:root[data-theme="dark"] .brand{color:var(--ink)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .brand{color:var(--ink)}}
.nav{display:flex;gap:18px;margin-inline-start:auto;font-size:14.5px}
.nav a{color:var(--muted);text-decoration:none}.nav a:hover{color:var(--accent)}
.hdr .meta{margin-inline-start:auto;font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums}
@media (max-width:560px){.nav{display:none}}

.wrap{max-width:1100px;margin:0 auto;padding:24px 20px 56px}
.narrow{max-width:780px;margin:0 auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.pad{padding:26px}
@media (max-width:560px){.pad{padding:20px 18px}}
.muted{color:var(--muted)}
.sm{font-size:14px}

/* buttons */
.btn{appearance:none;border:0;border-radius:12px;padding:12px 22px;font-weight:600;font-size:16px;cursor:pointer;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;justify-content:center;gap:10px;transition:filter .15s,transform .08s}
.btn:hover{filter:brightness(1.08)}.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.btn.lg{padding:14px 30px;font-size:17px}
.btn.out{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.out:hover{box-shadow:inset 0 0 0 1.5px var(--accent);filter:none}
.btn.ghost{background:none;color:var(--muted);padding:10px 8px}
.btn.ghost:hover{color:var(--ink);filter:none}
.btn.sm{padding:8px 14px;font-size:14px;border-radius:10px}

/* landing */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:20px;align-items:center;padding:36px 36px 0;background:linear-gradient(160deg,var(--hero-a),var(--hero-b));overflow:hidden}
.hero h1{font-size:clamp(28px,4.4vw,44px);color:var(--navy);margin-bottom:14px}
:root[data-theme="dark"] .hero h1{color:var(--ink)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hero h1{color:var(--ink)}}
.hero h1 span{color:var(--accent)}
.hero .lead{color:var(--muted);font-size:17px;max-width:32em;margin-bottom:24px}
.hero .cta{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:34px}
.hero-art{align-self:end}
.hero-art svg{width:100%;height:auto;display:block;max-height:360px}
.hstats{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin:0 -36px;background:var(--surface);border-top:1px solid var(--line)}
.hstats div{display:flex;align-items:center;gap:12px;padding:16px 24px;font-size:14px;color:var(--muted)}
.hstats div+div{border-inline-start:1px solid var(--line)}
.hstats b{display:block;color:var(--ink);font-size:20px;font-variant-numeric:tabular-nums;line-height:1.3}
.hstats .ic{color:var(--accent)}
@media (max-width:820px){
  .hero{grid-template-columns:1fr;padding:26px 22px 0}
  .hero-art{order:-1;max-width:340px;justify-self:center}
  .hstats{margin:0 -22px;grid-template-columns:1fr 1fr 1fr}
  .hstats div{flex-direction:column;align-items:flex-start;gap:4px;padding:12px 14px;font-size:12.5px}
  .hstats b{font-size:17px}
}
.sec-t{font-size:22px;margin:38px 0 6px;color:var(--ink)}
.sec-s{color:var(--muted);margin-bottom:16px}
.feat4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.feat4 .card{padding:20px}
.fi{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);margin-bottom:12px}
.feat4 h3{font-size:16.5px;margin-bottom:6px}
.feat4 p{font-size:14.5px;color:var(--muted)}
@media (max-width:900px){.feat4{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.feat4{grid-template-columns:1fr}}
.tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tcard{padding:16px 18px;border-radius:14px;background:var(--surface);border:1px solid var(--line);border-inline-start:4px solid}
.tcard b{display:flex;align-items:center;gap:8px}
.tl{display:inline-grid;place-items:center;min-width:24px;height:24px;border-radius:7px;color:#fff;font-size:13px;font-weight:700}
.tcard p{font-size:14px;color:var(--muted);margin-top:4px}
@media (max-width:820px){.tgrid{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.tgrid{grid-template-columns:1fr}}
.faq details{border-bottom:1px solid var(--line);padding:14px 4px}
.faq details:last-child{border-bottom:0}
.faq summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:10px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";color:var(--accent);font-size:20px;line-height:1}
.faq details[open] summary::after{content:"−"}
.faq p{color:var(--muted);margin-top:8px;font-size:15px}

/* intro */
.stepper{display:flex;align-items:flex-start;justify-content:center;gap:0;margin:4px 0 22px}
.stp{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;color:var(--muted);min-width:90px}
.stp i{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:700;border:2px solid var(--line);background:var(--surface);color:var(--muted)}
.stp.on{color:var(--ink);font-weight:600}.stp.on i{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.stp-line{flex:1;max-width:120px;height:2px;background:var(--line);margin-top:15px}
.intro h1{text-align:center;font-size:26px;margin-bottom:20px}
.ifeat{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.ifeat div{border:1px solid var(--line);border-radius:14px;padding:18px 14px;text-align:center}
.ifeat .ic{color:var(--accent);margin-bottom:6px}
.ifeat b{display:block;margin-bottom:4px}
.ifeat span{font-size:13.5px;color:var(--muted);line-height:1.6;display:block}
@media (max-width:600px){.ifeat{grid-template-columns:1fr}.ifeat div{display:grid;grid-template-columns:auto 1fr;text-align:start;gap:0 12px;align-items:center}.ifeat .ic{grid-row:span 2;margin:0}}
.imeta{display:grid;grid-template-columns:1fr 1fr;margin:18px 0 4px;border:1px solid var(--line);border-radius:14px}
.imeta div{display:flex;align-items:center;gap:12px;padding:14px 18px;font-size:14px;color:var(--muted)}
.imeta div+div{border-inline-start:1px solid var(--line)}
.imeta b{display:block;color:var(--ink);font-size:15.5px}
.imeta .ic{color:var(--accent)}
.field{margin-top:20px}
.lbl{display:block;font-weight:600;margin-bottom:10px}
.lbl small{font-weight:400;color:var(--muted)}
input[type=text]{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--soft)}
input[type=text]:focus{outline:none;border-color:var(--accent)}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.chip{display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:start;padding:11px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;line-height:1.5;font-size:15px}
.chip:hover{border-color:var(--accent-line)}
.chip.on{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.rd{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex:none;transition:all .15s}
.on > .rd{border-color:var(--accent);background:var(--accent);box-shadow:inset 0 0 0 3px var(--surface)}
.err{color:var(--bad);font-size:14px;min-height:22px;margin-top:10px}
.center{display:flex;justify-content:center}

/* question shell */
.qhead{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.part{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--accent);font-weight:600;border-radius:99px;padding:2px 12px;font-size:13px}
.pbar{height:6px;border-radius:99px;background:var(--line);margin:10px 0 0;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.segs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}
.segs span{font-size:11.5px;color:var(--muted);text-align:center;line-height:1.3}
.segs span.on{color:var(--accent);font-weight:600}
@media (max-width:520px){.segs{display:none}}
.qcard{margin-top:16px}
.qlead{color:var(--muted);font-size:15px}
.qtext{font-size:clamp(20px,3.2vw,25px);font-weight:700;line-height:1.6;margin:6px 0 22px;text-wrap:balance}
.olist{display:grid;gap:10px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:start;padding:13px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;line-height:1.55;font-size:15.5px;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--accent-line)}
.opt.on{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.opt .k{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--soft);border:1px solid var(--line);font-size:13px;font-weight:700;color:var(--muted);flex:none}
.opt.on .k{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt .tx{flex:1}
.qnav{display:flex;justify-content:space-between;align-items:center;margin-top:24px;gap:10px}
.kbd{font-size:12px;color:var(--muted);text-align:center;margin-top:12px}
@media (max-width:560px){.kbd{display:none}}

/* pair */
.pair{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.pc{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:22px 16px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;transition:all .15s}
.pc:hover{border-color:var(--accent-line)}
.pc .pi{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;background:var(--soft);color:var(--navy)}
.pc b{font-size:16px;line-height:1.5}
.pc small{color:var(--muted);font-size:13.5px}
.pc.on{border-color:var(--accent);background:var(--accent-soft)}
.pc.on .pi{background:var(--accent);color:var(--accent-ink)}
@media (max-width:480px){.pair{grid-template-columns:1fr}}

/* section intro & milestones */
.sec-hero{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
.sec-ic{width:72px;height:72px;border-radius:20px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.sec-hero h2{font-size:23px;margin-bottom:6px}
.sec-points{display:grid;gap:8px;margin-top:18px;padding:0;list-style:none}
.sec-points li{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.sec-points .ic{color:var(--accent);margin-top:4px}
@media (max-width:520px){.sec-hero{grid-template-columns:1fr}}
.mile{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center}
.ring{--v:50;width:120px;height:120px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--accent) calc(var(--v)*1%),var(--line) 0)}
.ring span{width:96px;height:96px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.ring.sm{width:58px;height:58px}.ring.sm span{width:46px;height:46px;font-size:14.5px}
.tipbox{display:flex;gap:10px;background:var(--amb-soft);border-radius:12px;padding:12px 14px;margin-top:16px;font-size:14.5px}
.tipbox .ic{color:var(--amb);margin-top:3px}
.done{text-align:center;padding:40px 26px}
.done .chk{width:84px;height:84px;border-radius:50%;background:var(--ok);display:grid;place-items:center;margin:0 auto 18px;color:#fff;position:relative}
.done .chk::before,.done .chk::after{content:"";position:absolute;inset:-26px;border-radius:50%;background:radial-gradient(circle,var(--gold) 2.5px,transparent 3px) 0 0/34px 34px,radial-gradient(circle,var(--teal) 2px,transparent 2.5px) 15px 12px/30px 30px;opacity:.7;z-index:-1;mask:radial-gradient(circle,transparent 46%,#000 47%)}
.done .chk::after{inset:-40px;background:radial-gradient(circle,var(--purple) 2px,transparent 2.5px) 6px 6px/38px 38px;opacity:.5}
.done h1{font-size:26px;margin-bottom:8px}

/* tasks */
.tfield{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--navy);background:var(--soft);border:1px solid var(--line);border-radius:99px;padding:2px 12px}
:root[data-theme="dark"] .tfield{color:var(--ink)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tfield{color:var(--ink)}}
.ttitle{font-size:22px;margin:12px 0 6px}
.tintro{color:var(--muted);margin-bottom:18px}
.codebox{direction:rtl;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;background:#0f2a36;color:#d9f3f2;border-radius:12px;padding:14px 18px;white-space:pre;font-size:15px;line-height:1.9;margin-bottom:16px;overflow-x:auto}
.rule{border-inline-start:4px solid var(--gold);background:var(--soft);padding:12px 14px;border-radius:10px;margin-bottom:16px;font-size:15px}
.ttable{width:100%;border-collapse:collapse;margin-bottom:16px;font-variant-numeric:tabular-nums}
.ttable th,.ttable td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:start}
.ttable th{font-size:13.5px;color:var(--muted);font-weight:600;background:var(--soft)}
.mchart{margin:0 auto 16px;max-width:520px}
.mchart svg{width:100%;height:auto;display:block}
.bopts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bopt{border:1.5px solid var(--line);border-radius:14px;background:var(--surface);cursor:pointer;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:14px}
.bopt svg{width:100%;height:auto;color:var(--navy)}
:root[data-theme="dark"] .bopt svg{color:var(--ink)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .bopt svg{color:var(--ink)}}
.bopt.on{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.ordl{display:grid;gap:10px}
.ordi{display:flex;align-items:center;gap:12px;padding:13px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;text-align:start;width:100%}
.ordi .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:2px dashed var(--line);font-weight:700;flex:none;color:var(--muted)}
.ordi.on{border-color:var(--accent);background:var(--accent-soft)}
.ordi.on .n{border:0;background:var(--accent);color:var(--accent-ink)}
.fb{border-radius:12px;padding:14px 16px;margin-top:16px;font-size:15px}
.fb.ok{background:var(--ok-soft)}.fb.no{background:var(--bad-soft)}
.fb b{display:block;margin-bottom:2px}
.fb.ok b{color:var(--ok)}.fb.no b{color:var(--bad)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.enj{margin-top:20px;padding-top:18px;border-top:1px dashed var(--line)}
.enj .lbl{margin-bottom:10px}
.escale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.escale button{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 4px;cursor:pointer;font-size:13px;line-height:1.3;display:flex;flex-direction:column;align-items:center;gap:6px}
.escale button svg{color:var(--muted)}
.escale button.on{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.escale button.on svg{color:var(--accent)}

/* subjects */
.subj{display:grid;grid-template-columns:170px 1fr;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.subj:last-child{border-bottom:0}
.subj .nm{font-weight:600}
.seg{display:grid;grid-template-columns:repeat(5,1fr);border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{border:0;border-inline-start:1px solid var(--line);background:var(--surface);padding:9px 2px;font-size:13px;cursor:pointer;line-height:1.3}
.seg button:first-child{border-inline-start:0}
.seg button:hover{background:var(--accent-soft)}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
@media (max-width:560px){.subj{grid-template-columns:1fr;gap:8px}}
.adnote{display:flex;gap:10px;background:var(--accent-soft);border-radius:12px;padding:12px 14px;font-size:14.5px;margin-bottom:18px}

/* ===================== الحالة ===================== */
const KEY = 'samt_v1';
const DEFW = {ri:7, sub:4, exp:5, pref:2, feas:1};
let S = load() || fresh();
function fresh(){ return {view:'landing', name:'', track:null, tier:null, A:{}, pos:0, adapt:null, subj:{}, years:null, env:null, val:null, tab:'sum', W:{...DEFW}, finished:false}; }
function load(){ try{ const x=JSON.parse(localStorage.getItem(KEY)||'null'); if(!x||typeof x!=='object') return null; return sanitize(x); }catch(e){ return null; } }
// نتحقق من كل حقل محفوظ حسب نوعه ونطاقه؛ التالف يُحذف لوحده ويبقى باقي التقدم
function sanitize(x){
  const s=fresh();
  const int=(v,lo,hi)=>Number.isInteger(v)&&v>=lo&&v<=hi;
  const inList=(v,list)=>list.some(o=>o.k===v);
  if (['landing','intro','flow','results'].includes(x.view)) s.view=x.view;
  if (typeof x.name==='string') s.name=x.name.slice(0,40);
  if (inList(x.track,TRACKS)) s.track=x.track;
  if (inList(x.tier,TIERS)) s.tier=x.tier;
  if (inList(x.years,YEARS)) s.years=x.years;
  if (inList(x.env,ENVS)) s.env=x.env;
  if (inList(x.val,VALS)) s.val=x.val;
  if (['sum','wish','vs','rec'].includes(x.tab)) s.tab=x.tab;
  if (int(x.pos,0,1000)) s.pos=x.pos;
  s.finished = x.finished===true;
  const W=(x.W&&typeof x.W==='object')?x.W:{};
  Object.keys(DEFW).forEach(k=>{ if (int(W[k],0,10)) s.W[k]=W[k]; });
  if (Object.values(s.W).every(v=>v===0)) s.W={...DEFW};
  const sj=(x.subj&&typeof x.subj==='object')?x.subj:{};
  SUBJECTS.forEach(({k})=>{ if (int(sj[k],1,5)) s.subj[k]=sj[k]; });
  const A=(x.A&&typeof x.A==='object')?x.A:{};
  QL.forEach((_,i)=>{ if (int(A['L'+i],0,4)) s.A['L'+i]=A['L'+i]; });
  PAIRS.forEach((_,i)=>{ if (A['P'+i]==='a'||A['P'+i]==='b') s.A['P'+i]=A['P'+i]; });
  CH.forEach((c,i)=>{ if (int(A['C'+i],0,c.o.length-1)) s.A['C'+i]=A['C'+i]; });
  DISC.forEach((_,i)=>{ if (['a','b','n'].includes(A['D'+i])) s.A['D'+i]=A['D'+i]; });
  TASKS.forEach((t,i)=>{
    const a=A['T'+i]; if (!a||typeof a!=='object') return;
    const n = t.kind==='order' ? t.items.length : t.opts.length, o={};
    const uniq=(arr,full)=>Array.isArray(arr)&&arr.every(v=>int(v,0,n-1))&&new Set(arr).size===arr.length&&(!full||arr.length===n);
    if (t.kind==='order'){ if (uniq(a.perm,true)) o.perm=a.perm; if (uniq(a.pick,false)) o.pick=a.pick; }
    else if (int(a.pick,0,n-1)) o.pick=a.pick;
    const complete = t.kind==='order' ? !!(o.pick && o.pick.length===n) : o.pick!==undefined;
    if (a.done===true && complete){
      o.done=true; o.ok = t.kind==='order' ? ordOk(t,o.pick) : o.pick===t.correct;
      if (int(a.enjoy,0,4)) o.enjoy=a.enjoy;
    }
    s.A['T'+i]=o;
  });
  if (Array.isArray(x.adapt) && x.adapt.length<=4 && x.adapt.every(i=>int(i,0,DISC.length-1)) && new Set(x.adapt).size===x.adapt.length) s.adapt=x.adapt;
  // بدون مسار ونسبة صالحين ما نقدر نحسب نتيجة: نرجعه لشاشة التعريف ويختارهم من جديد (الإجابات تبقى)
  if (!s.track || s.tier===null){ s.finished=false; if (s.view==='flow'||s.view==='results') s.view='intro'; }
  if (s.view==='results' && !s.finished) s.view='landing';
  return s;
}
let saveWarned=false;

const app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const RM = ()=>{ try{ return matchMedia('(prefers-reduced-motion:reduce)').matches; }catch(e){ return false; } };

/* ===================== المسار (Flow) ===================== */
function flow(){
  const f=[];
  // نخلط "أي النشاطين" بين عبارات الميول عشان ما يمل الطالب
  QL.forEach((_,i)=>{ f.push({k:'lk',i}); if (i%5===4 && PAIRS[(i-4)/5]) f.push({k:'pr',i:(i-4)/5}); });
  f.push({k:'mid'});
  f.push({k:'sec',s:'ch'}); CH.forEach((_,i)=>f.push({k:'ch',i}));
  f.push({k:'sec',s:'t'});  TASKS.forEach((_,i)=>f.push({k:'task',i}));
  f.push({k:'subj'}); f.push({k:'prefs'});
  f.push({k:'sec',s:'ad'}); (S.adapt||[]).forEach((d,j)=>f.push({k:'ad',j,d}));
  f.push({k:'done'});
  return f;
}
const ANS = new Set(['lk','pr','ch','task','subj','prefs','ad']);
function answered(it){
  const A=S.A;
  switch(it.k){
    case 'lk': return A['L'+it.i]!==undefined;
    case 'pr': return !!A['P'+it.i];
    case 'ch': return A['C'+it.i]!==undefined;
    case 'task': return !!(A['T'+it.i] && A['T'+it.i].enjoy!==undefined);
    case 'subj': return SUBJECTS.every(s=>S.subj[s.k]);
    case 'prefs': return !!(S.years && S.env && S.val);
    case 'ad': return !!A['D'+it.d];
    default: return true;
  }
}
function progress(){
  const f=flow(), cur=f[S.pos]; let total=0, done=0;
  f.forEach((it,k)=>{ if(ANS.has(it.k)){ total++; if(k<S.pos) done++; } });
  if (S.adapt===null) total += 4;
  return {idx:done+1, total, pct: Math.min(100,Math.round(done/total*100)), isQ: !!cur && ANS.has(cur.k)};
}
const PARTS = ['ميولك','تحديات التفكير','جرّب التخصص','موادك وتفضيلاتك','أسئلة مخصصة'];
function partOf(it){ return ({lk:0,pr:0,mid:0,ch:1,task:2,subj:3,prefs:3,ad:4,done:4})[it.k] ?? (it.s==='ch'?1:it.s==='t'?2:4); }

function next(){
  clearTimeout(autoT);
  if (S.view!=='flow') return;
  const f=flow();
  if (!answered(f[S.pos])) return showMissing(f[S.pos]);
  if (S.pos < f.length-1){
    S.pos++;
    const it = flow()[S.pos];
    // الأسئلة المخصصة تُحسب من جديد كل مرة (الإجابات محفوظة برقم السؤال نفسه، فما تضيع)
    if (it.k==='sec' && it.s==='ad') S.adapt = pickAdaptive();
  }
  save(); render(); top0();
}
function prev(){
  clearTimeout(autoT);
  if (S.pos>0){ S.pos--; save(); render(); top0(); }
  else { S.view='intro'; save(); render(); top0(); }
}
function showMissing(it){
  const h=document.getElementById('hint'); let msg='اختر إجابة عشان تكمل', first=null;
  if (it.k==='subj'){
    const rows=[...app.querySelectorAll('.subj')].filter(r=>!S.subj[r.dataset.row]);
    rows.forEach(r=>r.classList.add('miss')); first=rows[0];
    msg = rows.length===1 ? 'باقي مادة وحدة ما قيّمتها' : `باقي ${rows.length} مواد ما قيّمتها`;
  } else if (it.k==='prefs'){
    const fs=[...app.querySelectorAll('[data-f]')].filter(x=>!S[x.dataset.f]);
    fs.forEach(x=>x.classList.add('miss')); first=fs[0]; msg='اختر من كل قسم عشان تكمل';
  } else if (it.k==='task'){
    const a=S.A['T'+it.i]||{};
    if (!a.done) msg='حل المهمة واضغط "تأكيد الإجابة" أول';
    else { first=app.querySelector('.enj'); first && first.classList.add('miss'); msg='قيّم قد إيش استمتعت بالمهمة عشان تكمل'; }
  }
  if (h){ h.textContent=msg; }
  if (first) first.scrollIntoView({behavior:RM()?'auto':'smooth',block:'center'});
}

/* ===================== الحساب ===================== */
const CH_OPP = Object.fromEntries(ORDER.map(t=>[t, CH.reduce((n,c)=>n+c.o.filter(o=>o.t===t).length,0)]));
function profile(){
  const L={},P={},C={}; ORDER.forEach(t=>{L[t]=0;P[t]=0;C[t]=0;});
  QL.forEach((q,i)=>{ L[q.t] += (S.A['L'+i] ?? 2); });
  PAIRS.forEach((p,i)=>{ const v=S.A['P'+i]; if(v) P[p[v].t]++; });
  const dom={}; Object.keys(DOM_N).forEach(d=>dom[d]=0);
  CH.forEach((c,i)=>{ const v=S.A['C'+i]; if(v!==undefined){ const o=c.o[v]; C[o.t]++; o.d.forEach(d=>dom[d]++); } });
  // كل نمط ينقسم على عدد مرات ظهوره كخيار في التحديات (I وE يظهرون أكثر من R وA وC)
  const pct={}; ORDER.forEach(t=>{ pct[t]=Math.round(100*(.6*L[t]/20 + .15*P[t]/2 + .25*(CH_OPP[t]?C[t]/CH_OPP[t]:0))); });
  const tdom={}, tinfo={};
  TASKS.forEach((t,i)=>{ const a=S.A['T'+i]; if(a && a.enjoy!==undefined){ const v=.8*(a.enjoy/4)+.2*(a.ok?1:0); tinfo[t.id]={enjoy:a.enjoy, ok:a.ok}; t.dom.forEach(d=>{ tdom[d]=Math.max(tdom[d]??0, v); }); } });
  const dmax=Math.max(1,...Object.values(dom));
  const top=[...ORDER].sort((a,b)=>pct[b]-pct[a]);
  return {L,P,C,pct,dom,dmax,tdom,tinfo,top};
}

function compute(W=S.W, useAd=true){
  const pr = profile(), pct = pr.pct;
  const max = Math.max(...ORDER.map(t=>pct[t]),1);
  const rel = {}; ORDER.forEach(t=> rel[t] = .5*(pct[t]/100) + .5*(pct[t]/max));
  const bonus = {}, adWhy = {};
  if (useAd && S.adapt) S.adapt.forEach(di=>{
    const d=DISC[di], v=S.A['D'+di]; if(!d || !v || v==='n') return;
    const win = v==='a'?d.a:d.b, lose = v==='a'?d.b:d.a;
    bonus[win]=(bonus[win]||0)+6; bonus[lose]=(bonus[lose]||0)-3;
    (adWhy[win]=adWhy[win]||[]).push(lose);
  });
  const yearsMax = S.years ?? 99;
  const sumW = (W.ri+W.sub+W.exp+W.pref+W.feas) || 1;
  const all = M.map(m=>{
    const w=[3,2,1];
    const ri = m.code.split('').reduce((s,t,k)=>s + w[k]*rel[t], 0) / 6;
    let sw=0, ss=0; Object.entries(m.sub).forEach(([k,wt])=>{ sw+=wt; ss += wt*(((S.subj[k]||3)-1)/4); });
    const sub = sw ? ss/sw : .5;
    const doms = MDOM[m.id]||[];
    const tv = doms.filter(d=>pr.tdom[d]!==undefined).map(d=>pr.tdom[d]);
    // ما فيه مهمة تقيس هذا التخصص → ما نخترع قيمة؛ وزن التجربة كله يروح لطريقة التفكير
    const trial = tv.length ? tv.reduce((a,b)=>a+b,0)/tv.length : null;
    const think = doms.length ? .3 + .7*(doms.reduce((a,d)=>a+pr.dom[d]/pr.dmax,0)/doms.length) : .4;
    const yOk = m.yrs <= yearsMax;
    const envFit = S.env==='flex' ? .7 : (m.env.includes(S.env) ? 1 : .35);
    const valFit = m.val.includes(S.val) ? 1 : .45;
    const pref = (yOk?1:0)*.4 + envFit*.3 + valFit*.3;
    const gap = S.tier ? m.comp - S.tier : 0;
    const feas = !S.tier ? .8 : gap>0 ? Math.max(0, 1-.3*gap) : 1;
    const exp = trial===null ? think : .6*trial + .4*think;
    const raw = (W.ri*ri + W.sub*sub + W.exp*exp + W.pref*pref + W.feas*feas)/sumW*100 + (bonus[m.id]||0);
    const score = Math.max(5, Math.min(99, Math.round(raw)));
    const eligible = TR_GROUPS[m.tr].includes(S.track);

    const why=[], warn=[];
    m.code.split('').slice(0,2).forEach(t=>{ if (pct[t] >= 55) why.push(`ميولك <b>${TYPES[t].s}</b> ${pct[t]>=75?'عالية':'جيدة'} (${pct[t]}%)، وهي من أساسيات هذا التخصص.`); });
    const strong = Object.entries(m.sub).filter(([k,wt])=>wt>=2 && (S.subj[k]||0)>=4).map(([k])=>SUBJ_N[k]);
    if (strong.length) why.push(`مستواك قوي في ${strong.join(' و')}، وهي مواد يعتمد عليها التخصص.`);
    TASKS.forEach(t=>{ const ti=pr.tinfo[t.id]; if (ti && ti.enjoy>=3 && t.dom.some(d=>doms.includes(d))) why.push(`استمتعت بمهمة <b>${t.field}</b> (${ti.enjoy+1}/5)${ti.ok?' وحليتها صح':''}، وهي قريبة من طبيعة الدراسة فيه.`); });
    const dHit = doms.filter(d=>pr.dom[d]>=2);
    if (dHit.length) why.push(`في تحديات التفكير اخترت الحلول <b>${dHit.map(d=>DOM_N[d]).join(' و')}</b> أكثر من مرة.`);
    if (adWhy[m.id]) why.push(`فضّلته في الأسئلة المخصصة على ${adWhy[m.id].map(id=>MBY[id].n).join(' و')}.`);
    if (m.env.includes(S.env)) why.push(`بيئة العمل فيه تناسب تفضيلك: ${ENV_N[S.env]}.`);
    if (m.val.includes(S.val)) why.push(`يحقق اللي يهمك في الوظيفة: ${VAL_N[S.val]}.`);
    if (!why.length) why.push('يتوافق بشكل عام مع مزيج ميولك ومستواك في المواد.');

    const weak = Object.entries(m.sub).filter(([k,wt])=>wt>=2 && (S.subj[k]||3)<=2).map(([k])=>SUBJ_N[k]);
    if (weak.length) warn.push(`${weak.join(' و')} ${weak.length>1?'مواد أساسية':'مادة أساسية'} فيه، وتقييمك لنفسك فيها ضعيف. تحتاج تقوية جادة قبل الجامعة أو في السنة التحضيرية.`);
    if (pct[m.code[0]]<45) warn.push(`الجانب ${TYPES[m.code[0]].s} هو جوهر التخصص، وميولك له منخفضة نسبيًا (${pct[m.code[0]]}%).`);
    TASKS.forEach(t=>{ const ti=pr.tinfo[t.id]; if (ti && ti.enjoy<=1 && t.dom.some(d=>doms.includes(d))) warn.push(`مهمة ${t.field} ما عجبتك كثير، وهي تشبه جزء من الدراسة فيه.`); });
    if (!yOk) warn.push(`مدة الدراسة (${m.yt}) أطول مما تتقبّل.`);
    if (gap>0) warn.push(`حسب تقدير سَمْت، التنافس عليه ${COMP_N[m.comp]} مقارنة بنسبتك المتوقعة (تقدير عام، مو نسب قبول رسمية). حطّه رغبة لكن لا تعتمد عليه وحده.`);

    let tag=null;
    if (!eligible) tag={c:'no',t:'قد يتطلب مسارًا آخر: تأكد من دليل القبول'};
    else if (S.tier){ tag = gap>0 ? {c:'amb',t:'رغبة طموحة'} : gap>=-1 ? {c:'fit',t:'رغبة مناسبة'} : {c:'safe',t:'رغبة آمنة'}; }
    return {m, score, raw, eligible, why, warn, tag, bonus:bonus[m.id]||0, f:{ri,sub,trial,think,pref,feas}};
  }).sort((a,b)=>b.raw-a.raw);
  const el = all.filter(r=>r.eligible);
  const other = all.filter(r=>!r.eligible);
  return {pr, pct, top:pr.top, all, el, list: el.slice(0,10), other, wish: [...el.slice(0,10), ...other]};
}
const MBY = Object.fromEntries(M.map(m=>[m.id,m]));
const TR_LBL = {health:'غالبًا الصحة والحياة أو العام', eng:'غالبًا علوم الحاسب والهندسة أو العام', sci:'غالبًا المسارات العلمية', all:'غالبًا كل المسارات'};

function pickAdaptive(){
  const R = compute(S.W,false);
  const top8 = R.el.slice(0,8).map(r=>r.m.id), top12 = R.el.slice(0,12).map(r=>r.m.id), top3 = top8.slice(0,3);
  const sc = Object.fromEntries(R.el.map(r=>[r.m.id,r.score]));
  let cand = DISC.map((d,idx)=>({idx,d,ok: top8.includes(d.a)&&top8.includes(d.b), diff: Math.abs((sc[d.a]??0)-(sc[d.b]??0))})).filter(x=>x.ok).sort((a,b)=>a.diff-b.diff);
  if (cand.length<2) cand = cand.concat(DISC.map((d,idx)=>({idx,d,ok:(top3.includes(d.a)&&top12.includes(d.b))||(top3.includes(d.b)&&top12.includes(d.a)),diff:Math.abs((sc[d.a]??0)-(sc[d.b]??0))})).filter(x=>x.ok && !cand.some(c=>c.idx===x.idx)).sort((a,b)=>a.diff-b.diff));
  const used={}, out=[];
  for (const c of cand){ if (out.length>=4) break; if ((used[c.d.a]||0)>=2 || (used[c.d.b]||0)>=2) continue; out.push(c.idx); used[c.d.a]=(used[c.d.a]||0)+1; used[c.d.b]=(used[c.d.b]||0)+1; }
  return out;
}

/* ===================== رسومات ===================== */
function hexSVG(pct, size=260){
  const c=size/2, R=size*0.29;
  const pt=(k,r)=>{ const a=(-90+k*60)*Math.PI/180; return [c+r*Math.cos(a), c+r*Math.sin(a)]; };
  const P=(arr)=>arr.map(n=>n.toFixed(1)).join(',');
  const ring=f=>ORDER.map((t,k)=>P(pt(k,R*f))).join(' ');
  let s=`<svg viewBox="0 0 ${size} ${size}" role="img" aria-label="سداسي هولاند لميولك">`;
  [1,.66,.33].forEach(f=>{ s+=`<polygon points="${ring(f)}" style="fill:${f===1?'var(--soft)':'none'};stroke:var(--line)" stroke-width="1.2"/>`; });
  ORDER.forEach((t,k)=>{ const [x,y]=pt(k,R); s+=`<line x1="${c}" y1="${c}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" style="stroke:var(--line)"/>`; });
  s+=`<polygon class="hexpoly" points="${ORDER.map((t,k)=>P(pt(k,R*Math.max(.06,pct[t]/100)))).join(' ')}" style="fill:var(--accent);fill-opacity:.18;stroke:var(--accent)" stroke-width="2.4" stroke-linejoin="round"/>`;
  ORDER.forEach((t,k)=>{ const [x,y]=pt(k,R*Math.max(.06,pct[t]/100)); s+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.6" style="fill:var(--accent)"/>`; });
  ORDER.forEach((t,k)=>{ const [x,y]=pt(k,R+size*0.11); s+=`<circle cx="${x.toFixed(1)}" cy="${(y-size*0.045).toFixed(1)}" r="${size*0.02}" style="fill:${TYPE_C[t]}"/><text x="${x.toFixed(1)}" y="${(y+size*0.03).toFixed(1)}" text-anchor="middle" font-weight="600" font-size="${size*0.054}" style="fill:var(--ink)" font-family="IBM Plex Sans Arabic, sans-serif">${TYPES[t].s}</text>`; });
  return s+'</svg>';
}

// نافذة تأكيد داخل الصفحة
function ask(title, body, okLabel, onOk){
  if (document.querySelector('.dlg')) return;
  clearTimeout(autoT);
  const d=document.createElement('div'); d.className='dlg'; d.setAttribute('role','dialog'); d.setAttribute('aria-modal','true'); d.setAttribute('aria-labelledby','dlgT');
  d.innerHTML=`<div class="card"><h3 id="dlgT">${title}</h3><p class="muted">${body}</p><div class="row"><button class="btn danger" data-dlg="ok">${okLabel}</button><button class="btn out" data-dlg="no">إلغاء</button></div></div>`;
  const prevF=document.activeElement;
  const close=()=>{ d.remove(); document.removeEventListener('keydown',esc_); prevF && prevF.focus && prevF.focus(); };
  const esc_=e=>{
    if (e.key==='Escape') return close();
    if (e.key==='Tab'){ // التركيز يبقى داخل النافذة
      const bs=[...d.querySelectorAll('button')], i=bs.indexOf(document.activeElement);
      const n = e.shiftKey ? (i<=0?bs.length-1:i-1) : (i<0||i===bs.length-1?0:i+1);
      bs[n].focus(); e.preventDefault();
    }
  };
  d.addEventListener('click',e=>{ const x=e.target.closest('[data-dlg]'); if(e.target===d || (x && x.dataset.dlg==='no')) close(); else if (x){ close(); onOk(); } e.stopPropagation(); });
  document.addEventListener('keydown',esc_);
  document.body.appendChild(d); d.querySelector('[data-dlg=no]').focus();
}

    <div class="qhead"><span class="part">الجزء ${part+1}: ${PARTS[part]}${cnt}</span><span>${Math.max(0,p.pct)}%</span></div>
    <div class="pbar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${p.pct}" aria-label="تقدّم الاختبار"><i style="width:${Math.max(2,p.pct)}%"></i></div>
    <div class="segs">${PARTS.map((x,i)=>`<span class="${i===part?'on':''}">${x}</span>`).join('')}</div>
    <div class="card pad qcard">${inner}
      ${nav?`<div class="qbar"><p class="hint" id="hint" aria-live="polite"></p><div class="qnav"><button class="btn out sm" data-a="prev">${ic('right',18)} السابق</button><button class="btn sm ${ok?'':'dim'}" data-a="next" aria-disabled="${!ok}" aria-describedby="hint">التالي ${ic('left',18)}</button></div></div>`:''}
    </div>
  </div>`;
}

// نص مخفي لقارئ الشاشة بعد التأكيد: أي خيار صحيح وأي خيار اخترته
const resMark=(k,correct,pick)=>k===correct?`<span class="sr"> (الإجابة الصحيحة${pick===k?'، وهي إجابتك':''})</span>`:k===pick?'<span class="sr"> (إجابتك)</span>':'';
function taskBody(i){
  const t=TASKS[i], a=S.A['T'+i]||{};
  const done = a.done;
  let body=`<span class="tfield">${ic(t.ic,16)} مهمة من: ${t.field}</span><h2 class="ttitle qtext" id="q" style="font-size:clamp(20px,3vw,26px)">${t.title}</h2><p class="tintro">${t.intro}</p>`;
  if (t.code) body+=`<div class="codebox">${esc(t.code)}</div>`;
  if (t.rule) body+=`<div class="rule">${t.rule}</div>`;
  if (t.table) body+=`<table class="ttable"><thead><tr>${t.table[0].map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${t.table.slice(1).map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
  if (t.chart) body+=`<div class="mchart">${miniChart(t.chart)}</div>`;
  if (t.kind==='order'){
    const ord=a.pick||[];
    if (!a.perm){ a.perm=t.items.map((_,k)=>k).sort(()=>Math.random()-.5); if (a.perm.every((v,k)=>v===k)) a.perm.reverse(); S.A['T'+i]=a; save(); }
    const ORDN=['الأول','الثاني','الثالث','الرابع','الخامس'];
    body+=`<div class="ordl" role="group" aria-label="${esc(t.title)}">${a.perm.map(k=>{ const x=t.items[k], n=ord.indexOf(k); const isR = done && (a.ok || t.correct[n]===k); const cls = done ? (isR?'on right':'on wrong') : (n>=0?'on':''); const srt = n>=0 ? `ترتيبه ${ORDN[n]}${done?(isR?' (صحيح)':' (غير صحيح)'):''}: ` : 'غير مرتّب: '; return `<button class="ordi ${cls}" data-ord="${k}" aria-pressed="${n>=0}" ${done?'disabled':''}><span class="n" aria-hidden="true">${n>=0?n+1:''}</span><span><span class="sr">${srt}</span>${x}</span></button>`; }).join('')}</div>`;
    if (!done) body+=`<p class="muted sm" style="margin-top:8px">اضغط على المريض مرة ثانية إذا تبي تشيله من الترتيب.</p>`;
    if (!done) body+=`<div class="qnav" style="margin-top:12px"><button class="btn ghost sm" data-a="ordReset">${ic('redo',16)} إعادة الترتيب</button><button class="btn sm" data-a="tCheck" ${ord.length===t.items.length?'':'disabled'}>تأكيد الإجابة</button></div>`;
  } else if (t.opts[0] && t.opts[0].startsWith('bridge')){
    body+=`<div class="bopts" role="${done?'group':'radiogroup'}" aria-label="${esc(t.title)}">${t.opts.map((o,k)=>{ const cls = done ? (k===t.correct?'right':k===a.pick?'wrong':'') : (a.pick===k?'on':''); return `<button class="bopt ${cls}" data-tp="${k}" ${done?'disabled':rt(a.pick===k,k,a.pick===undefined)}>${bridge(o)}<span>${t.labels[k]}${done?resMark(k,t.correct,a.pick):''}</span></button>`; }).join('')}</div>`;
    if (!done) body+=`<div class="qnav" style="margin-top:12px;justify-content:flex-end"><button class="btn sm" data-a="tCheck" ${a.pick!==undefined?'':'disabled'}>تأكيد الإجابة</button></div>`;
  } else {
    body+=`<div class="olist" role="${done?'group':'radiogroup'}" aria-label="${esc(t.title)}">${t.opts.map((o,k)=>{ let cls=''; if(done){ if(k===t.correct) cls='right'; else if(k===a.pick) cls='wrong'; } else if (a.pick===k) cls='on'; return `<button class="opt ${cls}" data-tp="${k}" ${done?'disabled':rt(a.pick===k,k,a.pick===undefined)}><span class="k">${'أبجد'[k]}</span><span class="tx">${o}${done?resMark(k,t.correct,a.pick):''}</span></button>`; }).join('')}</div>`;
    if (!done) body+=`<div class="qnav" style="margin-top:12px;justify-content:flex-end"><button class="btn sm" data-a="tCheck" ${a.pick!==undefined?'':'disabled'}>تأكيد الإجابة</button></div>`;
  }
  if (done){
    const right = t.kind==='order' ? 'الترتيب المقبول: '+t.correct.map((k,n)=>`(${n+1}) ${t.items[k]}`).join('، ')+(t.altNote?` (${t.altNote})`:'') : 'الإجابة الصحيحة: '+(t.labels?t.labels[t.correct]:t.opts[t.correct]);
    body+=`<div class="fb ${a.ok?'ok':'no'}" tabindex="-1"><b>${a.ok?'إجابة صحيحة':'مو بالضبط، بس لا تشيل هم'}</b>${a.ok?'':`<p style="margin-bottom:6px;font-weight:600">${right}</p>`}${t.explain}</div>`;
    const faces=[0,1,2,3,4].map(k=>`<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><circle cx="9" cy="10" r=".6" fill="currentColor"/><circle cx="15" cy="10" r=".6" fill="currentColor"/><path d="${['M8 16.5c2.5-2 5.5-2 8 0','M8.5 16c2-1 5-1 7 0','M8.5 15.5h7','M8.5 14.5c2 1.2 5 1.2 7 0','M8 14c2.5 2.6 5.5 2.6 8 0'][k]}"/></svg>`);
    body+=`<div class="enj"><span class="lbl" id="l_enj">قد إيش استمتعت بهالمهمة؟</span><div class="escale" role="radiogroup" aria-labelledby="l_enj">${ENJOY.map((l,k)=>`<button class="${a.enjoy===k?'on':''}" ${rt(a.enjoy===k,k,a.enjoy===undefined)} data-enj="${k}">${faces[k]}${l}</button>`).join('')}</div></div>`;
  }
  return body;
}

function tabSum(R){
  const code=R.top.slice(0,3), pr=R.pr, best=R.list[0];
  const domTop = Object.entries(pr.dom).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]).slice(0,4);
  const strongTypes = ORDER.filter(t=>R.pct[t]>=60).length;
  const T1=TYPES[code[0]], T2=TYPES[code[1]];
  // "متقاربة" تعني فرق صغير بين أقوى نمطين، و"منخفضة" تعني ما فيه نمط قوي؛ حالتين مختلفتين
  const gap12 = R.pct[code[0]]-R.pct[code[1]];
  const mixMsg = strongTypes>=3 ? 'عندك ميول قوية في أكثر من مجال، وهذا يفتح لك خيارات متنوعة. ركز على التخصصات اللي تجمع بين أقوى نمطين عندك.'
    : strongTypes===0 && gap12<8 ? 'ميولك متقاربة وما فيه نمط واضح يتقدم على الباقي، وهذا طبيعي في عمرك. لا تعتمد على الميول وحدها: انتبه للمهام اللي استمتعت فيها فعلًا، وجرّب أكثر قبل القرار.'
    : strongTypes===0 ? `ما فيه نمط قوي جدًا عندك حاليًا، لكن أوضح ميولك هو ${T1.s}. خذ الترتيب كبداية للتفكير، وجرّب أكثر في المجالات القريبة منه.`
    : 'ميولك واضحة ومركزة، وهذا يسهّل اختيار التخصص.';
  return `<div class="grid2">
    <div class="stack">
      <div class="card pad sumcard">
        <div class="sumhero"><div>
          <span class="eyebrow">ملخص نتائجك</span>
          <h2>نمطك ${T1.s} · ${T2.s}</h2>
          <p class="muted">بناءً على إجاباتك في الميول والتحديات والمهام، ظهر عندك نمط <b style="color:var(--ink)">${T1.s}</b> بشكل أوضح، يليه <b style="color:var(--ink)">${T2.s}</b>. ${best?`وأعلى تخصص توافقًا معك هو <b style="color:var(--ink)">${best.m.n}</b>.`:''}</p>
        </div>${hexSVG(R.pct,220)}</div>
        <div class="tiles">
          <div class="tile">${ic('target',28)}<div><b>${best?best.m.n:'—'}</b><span>أعلى تخصص توافقًا</span></div></div>
          <div class="tile">${ic('hex',28)}<div><b>${code.map(t=>TYPES[t].s).join(' · ')}</b><span>أقوى 3 أنماط عندك (${code.join('')})</span></div></div>
          <div class="tile">${ic('cap',28)}<div><b>${R.list.length} تخصصات</b><span>مقترحة لمسارك</span></div></div>
        </div>
      </div>
      <div class="card pad">
        <h3 class="h3">${ic('cap',20)} أعلى 3 رغبات</h3>
        <p class="muted sm" style="margin-bottom:10px">ترتيب استرشادي حسب توافقها معك، مو نسبة قبول. اضغط على أي تخصص لتقرأ تفسيره.</p>
        <div class="rerank">${R.list.slice(0,3).map((r,i)=>`<button class="rr rrb" data-a="openWish" data-id="${r.m.id}"><span class="n">${i+1}</span><span>${r.m.n}</span><span>${r.tag?`<span class="pill ${r.tag.c}">${r.tag.t}</span>`:''}</span><b>${r.score}%</b></button>`).join('')}</div>
        <button class="btn sm" style="margin-top:14px;width:100%" data-tab="wish">شوف الترتيب الكامل مع التفسير ${ic('left',16)}</button>
      </div>
      <div class="card pad">
        <h3 class="h3">${ic('chart',20)} تفسير النتيجة العامة</h3>
        <div class="txt">
          <p><b>${T1.n}:</b> ${T1.d}</p>
          <p><b>${T2.n}:</b> ${T2.d}</p>
          <p class="muted">${mixMsg}</p>
        </div>
      </div>

function argue(a,b,W){
  const fw=FW(W);
  // العوامل اللي ما لها قياس (مثل تجربة تخصص ما له مهمة) ما ندخلها في المقارنة
  const d = FACT.filter(([k])=>a.f[k]!==null && b.f[k]!==null).map(([k,l])=>({k,l,v:fw[k]*(a.f[k]-b.f[k]), av:a.f[k], bv:b.f[k]})).sort((x,y)=>y.v-x.v);
  const pros = d.filter(x=>x.v>0.05).slice(0,3);
  const cons = d.filter(x=>x.v<-0.05).slice(-2).reverse();
  const bd = a.bonus-b.bonus;
  const adLi = bd>0 ? `<li>فضّلت ${a.m.n} في الأسئلة المخصصة، وهذا أضاف له ${bd} نقاط.</li>` : '';
  const adCon = bd<0 ? `<li class="con">لكنك فضّلت ${b.m.n} في الأسئلة المخصصة (${-bd} نقاط لصالحه).</li>` : '';
  return `<div class="arg"><h4>${ic('versus',18)} ليش ${a.m.n} قبل ${b.m.n}؟</h4>
    <ul>${pros.length||adLi?pros.map(x=>`<li>${x.l} أقوى في ${a.m.n} (${Math.round(x.av*100)}% مقابل ${Math.round(x.bv*100)}%).</li>`).join('')+adLi:'<li>الفرق بينهم بسيط جدًا، وأي واحد منهم خيار قوي لك.</li>'}
    ${cons.map(x=>`<li class="con">لكن ${b.m.n} يتفوق في ${x.l} (${Math.round(x.bv*100)}% مقابل ${Math.round(x.av*100)}%).</li>`).join('')}${adCon}</ul>
    <p class="muted sm" style="margin-top:6px">${Math.round(a.raw-b.raw)<1?'الاثنين متقاربين جدًا في درجة الملاءمة، والفرق أقل من نقطة.':'الفرق في درجة الملاءمة: '+Math.round(a.raw-b.raw)+' نقطة تقريبًا.'}</p></div>`;
}

  return `<div class="card pad">

      </div></div>
      ${hasNull?'<p class="scnote">— يعني ما فيه مهمة في الاختبار تقيس هذا التخصص مباشرة، فوزنها انحسب على طريقة تفكيرك.</p>':''}

function rerank(R){

    return `<div class="rr"><span class="n">${i+1}</span><span>${r.m.n}</span>${mv}<b>${r.score}%</b></div>`;
  }).join('');
}

// الأسهم تتنقل بين الخيارات (في RTL: اليسار = التالي)
document.addEventListener('keydown', e=>{
  const g=e.target.closest && e.target.closest('[role=radiogroup],[role=tablist]');
  if (!g || !/^Arrow/.test(e.key)) return;
  const r=[...g.querySelectorAll('[role=radio],[role=tab]')].filter(x=>!x.disabled), i=r.indexOf(e.target); if(i<0) return;
  const d=(e.key==='ArrowLeft'||e.key==='ArrowDown')?1:-1, t=r[(i+d+r.length)%r.length];
  r.forEach(x=>x.tabIndex=-1); t.tabIndex=0; t.focus(); e.preventDefault();
});
document.addEventListener('keydown', e=>{
  if (S.view!=='flow' || e.target.tagName==='INPUT' || e.repeat || e.ctrlKey || e.metaKey || e.altKey || document.querySelector('.dlg')) return;
  const it=flow()[S.pos]; const n=Number(e.key);
  const pick = sel => { const b=app.querySelector(sel); if (b){ b.click(); } };
  if (it.k==='lk' && n>=1 && n<=5) pick(`[data-lk="${5-n}"]`);
  else if (it.k==='ch' && n>=1 && n<=4) pick(`[data-ch="${n-1}"]`);
  else if (it.k==='pr' && (n===1||n===2)) pick(`[data-pr="${n===1?'a':'b'}"]`);
  else if (it.k==='ad' && n>=1 && n<=3) pick(`[data-ad="${['a','b','n'][n-1]}"]`);
  else if (e.key==='Enter' && (e.target===document.body || e.target.classList.contains('qtext'))) next();
});

let wRAF=0;
document.addEventListener('input', e=>{
  const k=e.target.dataset && e.target.dataset.w; if(!k) return;
  let v=Number(e.target.value);

  if (v===0 && Object.entries(S.W).every(([kk,vv])=>kk===k || vv===0)){ v=1; e.target.value='1'; toast('لازم يبقى عامل واحد على الأقل له وزن'); }

function loadScript(src){ return new Promise((ok,no)=>{ const sc=document.createElement('script'); sc.src=src; sc.async=true; sc.onload=ok; sc.onerror=()=>no(new Error('load '+src)); document.head.appendChild(sc); }); }
function loadPdfLibs(){ if(!pdfLibsP){ pdfLibsP=Promise.all(PDF_LIBS.map(loadScript)).catch(e=>{ pdfLibsP=null; throw e; }); } return pdfLibsP; }
async function savePdf(blob, name){
  if (window.claude && typeof window.claude.use==='function'){
    let dl=null; try{ dl=await window.claude.use('downloads'); }catch(e){}
    if (dl){
      try{ await dl.save({filename:name, data:blob}); return 'saved'; }
      catch(e){ if (e && e.code==='declined') return 'declined'; if (e && e.code==='rate_limited'){ toast('لحظة، فيه طلب تحميل مفتوح'); return 'declined'; } }
    }
  }
  const url=URL.createObjectURL(blob); const a=document.createElement('a');
  a.href=url; a.download=name; a.rel='noopener'; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 60000);
  return 'saved';
}
async function makePdf(){
  toast('جاري تجهيز ملف PDF…');
  try{ await loadPdfLibs(); }
  catch(e){ toast('ما قدرنا نجهّز PDF بدون إنترنت، بنفتح لك الطباعة'); try{ buildPrint(); window.print(); }catch(_){} return; }
  const pv=document.getElementById('pv');
  try{
    buildPrint(); document.body.classList.remove('pv-on');
    pv.classList.add('pv-cap');
    try{ await document.fonts.ready; }catch(e){}
    const pvTop=pv.getBoundingClientRect().top, total=pv.scrollHeight;
    // نقاط القطع المسموحة: بين البطاقات والعناوين، عشان ما تنقص بطاقة بين صفحتين
    const cuts=[...pv.children, ...pv.querySelectorAll('.stack > *')].map(el=>Math.round(el.getBoundingClientRect().top-pvTop)).filter(y=>y>0).sort((a,b)=>a-b);
    const H2C = window.html2canvas && (window.html2canvas.default || window.html2canvas);
    const scale = Math.min(2, window.devicePixelRatio>1 ? 2 : 1.6);
    const canvas = await H2C(pv,{scale, backgroundColor:'#ffffff', useCORS:true, logging:false,
      onclone:(doc)=>{ doc.documentElement.setAttribute('data-theme','light'); }});
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({unit:'pt', format:'a4', compress:true});
    const PW=pdf.internal.pageSize.getWidth(), PH=pdf.internal.pageSize.getHeight(), M=22;
    const k=(PW-2*M)/794, pageH=Math.floor((PH-2*M)/k);
    let y0=0, first=true;
    while (y0 < total-2){
      let y1=Math.min(total, y0+pageH);
      if (y1<total){ const c=cuts.filter(c=>c>y0+80 && c<=y1).pop(); if (c) y1=c; }
      const h=y1-y0, part=document.createElement('canvas');
      part.width=canvas.width; part.height=Math.round(h*scale);
      const ctx=part.getContext('2d'); ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,part.width,part.height);
      ctx.drawImage(canvas,0,Math.round(y0*scale),canvas.width,part.height,0,0,part.width,part.height);
      if(!first) pdf.addPage(); first=false;
      pdf.addImage(part.toDataURL('image/jpeg',0.9),'JPEG',M,M,PW-2*M,h*k);
      y0=y1;
    }
    const nm=(S.name||'').trim().replace(/[\\/:*?"<>|]/g,'');
    const r=await savePdf(pdf.output('blob'), (nm?'نتيجة '+nm:'نتيجتي')+' - سمت.pdf');
    if (r==='saved') toast('تم تجهيز ملف PDF');
  }catch(err){ console.error(err); toast('صار خطأ في تجهيز PDF، جرّب مرة ثانية'); }
  finally{ pv.classList.remove('pv-cap'); pv.innerHTML=''; }
}
document.addEventListener('keydown', e=>{
  const tm=document.getElementById('thmMenu'); if (!tm || tm.hidden) return;
  if (e.key==='Escape'){ closeThm(true); e.preventDefault(); e.stopPropagation(); }
  else if (e.key==='Tab' && tm.contains(document.activeElement)) closeThm(false);
});

document.addEventListener('click', async e=>{
  const tm=document.getElementById('thmMenu');
  if (tm && !tm.hidden && !(e.target.closest && e.target.closest('.thm'))) closeThm(false);
  const b=e.target.closest('button'); if(!b || b.disabled) return;
  const d=b.dataset, it = S.view==='flow' ? flow()[S.pos] : null;
  if (d.th){ setTheme(d.th); header(); const tb=document.querySelector('.thb'); tb && tb.focus(); say('المظهر: '+(THEMES.find(t=>t.k===d.th)||{}).n); return; }

  if (d.set){ S[d.set] = (d.set==='tier'||d.set==='years') ? Number(d.v) : d.v; save(); markSel(b); if (S.view==='intro') setErr(''); return; }
  if (d.tab){ const fromTab=b.getAttribute('role')==='tab'; S.tab=d.tab; save(); render(); if (fromTab){ const t=app.querySelector(`[role=tab][data-tab="${d.tab}"]`); t && t.focus({preventScroll:true}); } top0(); return; }
  if (d.lk!==undefined){ S.A['L'+it.i]=Number(d.lk); save(); markSel(b); autoNext(); return; }
  if (d.pr){ S.A['P'+it.i]=d.pr; save(); markSel(b); autoNext(); return; }
  if (d.ch!==undefined){ S.A['C'+it.i]=Number(d.ch); save(); markSel(b); autoNext(); return; }
  if (d.ad){ S.A['D'+it.d]=d.ad; save(); markSel(b); autoNext(); return; }
  if (d.sub){ S.subj[d.sub]=Number(d.v); save(); markSel(b); return; }
  if (d.ord!==undefined){
    const a=S.A['T'+it.i]||(S.A['T'+it.i]={}); a.pick=a.pick||[]; const k=Number(d.ord), t=TASKS[it.i];
    if (a.pick.includes(k)){ a.pick=a.pick.filter(x=>x!==k); say(`شلت من الترتيب: ${t.items[k]}`); }
    else { a.pick.push(k); say(`رقم ${a.pick.length}: ${t.items[k]}`); }
    save(); render(); return;
  }
  if (d.tp!==undefined){ const a=S.A['T'+it.i]||(S.A['T'+it.i]={}); a.pick=Number(d.tp); save(); render(); return; }
  if (d.enj!==undefined){ S.A['T'+it.i].enjoy=Number(d.enj); save(); markSel(b); app.querySelector('.enj')?.classList.remove('miss'); return; }

  switch(d.a){
    case 'home': S.view='landing'; save(); render(); top0(); break;
    case 'start': {
      const go=()=>{ const keep={name:S.name}; S=fresh(); S.name=keep.name; S.view='intro'; save(); render(); top0(); };
      const started = S.pos>0 || Object.keys(S.A).length>0;
      if (started) ask('تبي تبدأ من جديد؟','بتنمسح كل إجاباتك السابقة وما تقدر ترجعها.','نعم، ابدأ من جديد',go); else go();
      break;
    }
    case 'showRes': S.view='results'; save(); render(); top0(); break;
    case 'edit': S.view='flow'; S.pos=flow().length-1; save(); render(); top0(); break;
    case 'resume': {
      if (S.finished){ S.view='results'; }
      else if (!S.track || S.tier===null){ S.view='intro'; }
      else { S.view='flow'; const f=flow(); let p=0; while(p<f.length-1 && answered(f[p])) p++; S.pos=Math.max(S.pos,0)>p?S.pos:p; }
      save(); render(); top0(); break;
    }
    case 'begin':
      if (!S.track) return setErr('اختر مسارك في الثانوي.');
      if (S.tier===null) return setErr('اختر نسبتك المتوقعة، أو "لا أعرف بعد".');
      S.view='flow'; save(); render(); top0(); break;
    case 'next': next(); break;
    case 'prev': prev(); break;
    case 'ordReset': (S.A['T'+it.i] ||= {}).pick=[]; save(); render(); break;
    case 'tCheck': {
      const t=TASKS[it.i], a=S.A['T'+it.i];
      a.ok = t.kind==='order' ? ordOk(t,a.pick) : a.pick===t.correct;
      a.done=true; save(); render();
      const fb=app.querySelector('.fb'); if (fb){ fb.scrollIntoView({behavior:RM()?'auto':'smooth',block:'start'}); fb.focus({preventScroll:true}); }
      break;
    }
    case 'results': S.view='results'; S.tab='sum'; S.finished=true; save(); render(); top0(); break;
    case 'redo': ask('تعيد الاختبار من البداية؟','بتنمسح نتيجتك الحالية وإجاباتك كلها.','نعم، أعد الاختبار',()=>{ const nm=S.name; S=fresh(); S.name=nm; S.view='intro'; save(); render(); top0(); }); break;
    case 'resetW': S.W={...DEFW}; save(); render(); break;
    case 'thm': { if(!tm) break; const open=tm.hidden; tm.hidden=!open; b.setAttribute('aria-expanded',String(open)); if (open){ const c=tm.querySelector('[aria-checked="true"]'); c && c.focus(); } break; }
    case 'print': buildPrint(); try{ window.print(); }catch(err){ toast('الطباعة غير متاحة في هذا المتصفح'); } break;
    case 'pdf': if (b.disabled) break; b.disabled=true; makePdf().finally(()=>{ b.disabled=false; }); break;
    case 'openWish': {
      S.tab='wish'; save(); render();
      const det=app.querySelector(`details.wish[data-id="${d.id}"]`);
      if (det){ det.open=true; const sm=det.querySelector('summary'); sm && sm.focus({preventScroll:true}); det.scrollIntoView({behavior:RM()?'auto':'smooth',block:'start'}); }
      break;
    }
    case 'hardReset': ask('تمسح كل شيء؟','بتنمسح كل إجاباتك ونتيجتك وما تقدر ترجعها.','نعم، امسح وابدأ',()=>{ S=fresh(); save(); render(); top0(); }); break;
    case 'copy':
      { const txt=resultText(LAST||compute());
        try{ await navigator.clipboard.writeText(txt); toast('تم نسخ النتيجة'); }
        catch(err){ try{ const ta=document.createElement('textarea'); ta.value=txt; ta.style.cssText='position:fixed;opacity:0'; document.body.appendChild(ta); ta.select(); const ok=document.execCommand('copy'); ta.remove(); toast(ok?'تم نسخ النتيجة':'تعذّر النسخ من هذا المتصفح'); }catch(e2){ toast('تعذّر النسخ من هذا المتصفح'); } } }
      break;
  }
});

render();
</script>
